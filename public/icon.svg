<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0812"/>
      <stop offset="70%" stop-color="#120508"/>
      <stop offset="100%" stop-color="#070204"/>
    </radialGradient>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.6"/>

  <!-- Bat / Vampire Wings Wings Silhouette -->
  <path d="M 256 120 C 290 80 370 70 410 130 C 430 160 410 220 380 250 C 350 280 340 330 350 380 C 310 330 280 320 256 360 C 232 320 202 330 162 380 C 172 330 162 280 132 250 C 102 220 82 160 102 130 C 142 70 222 80 256 120 Z" 
        fill="url(#crestGrad)" opacity="0.9" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.8))"/>

  <!-- Masquerade Mask Motif -->
  <path d="M 170 230 C 210 200 240 225 256 235 C 272 225 302 200 342 230 C 370 250 360 285 320 285 C 280 285 265 255 256 255 C 247 255 232 285 192 285 C 152 285 142 250 170 230 Z"
        fill="#0f0710" stroke="url(#goldGrad)" stroke-width="8"/>
  
  <!-- Eyes -->
  <ellipse cx="210" cy="245" rx="18" ry="10" fill="#dc2626" transform="rotate(-10 210 245)"/>
  <ellipse cx="302" cy="245" rx="18" ry="10" fill="#dc2626" transform="rotate(10 302 245)"/>

  <!-- Gothic Letter D Crest -->
  <text x="256" y="445" font-family="Georgia, serif" font-weight="900" font-size="80" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">RENFIELD</text>
</svg>
